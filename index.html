function setupTabs() {
const tabRoot = document.getElementById("tabs");
const panelRoot = document.getElementById("panels");
const builders = [buildWorks, buildServices];
const tabs = new Array(TAB_IDS.length);
const panels = new Array(TAB_IDS.length);
const tf = document.createDocumentFragment();
const pf = document.createDocumentFragment();
for (let i = 0; i < TAB_IDS.length; i++) {
const t = el("button", "tab", TAB_NAMES[i]);
t.type = "button";
t.id = "tab-" + TAB_IDS[i];
t.setAttribute("role", "tab");
t.setAttribute("aria-controls", "panel-" + TAB_IDS[i]);
t.setAttribute("aria-selected", "false");
t.tabIndex = -1;
const p = el("section", "panel");
p.id = "panel-" + TAB_IDS[i];
p.setAttribute("role", "tabpanel");
p.setAttribute("aria-labelledby", t.id);
p.hidden = true;
p.appendChild(builders[i]());
tabs[i] = t;
panels[i] = p;
tf.appendChild(t);
pf.appendChild(p);
}
tabRoot.appendChild(tf);
panelRoot.appendChild(pf);

let current = -1;
function select(i, focus) {
if (i === current) return;
if (current >= 0) {
tabs[current].setAttribute("aria-selected", "false");
tabs[current].tabIndex = -1;
panels[current].hidden = true;
}
tabs[i].setAttribute("aria-selected", "true");
tabs[i].tabIndex = 0;
panels[i].hidden = false;
current = i;
if (focus) tabs[i].focus();
}

tabRoot.addEventListener("click", function (e) {
const i = tabs.indexOf(e.target);
if (i >= 0) select(i, false);
});
tabRoot.addEventListener("keydown", function (e) {
if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
const step = e.key === "ArrowRight" ? 1 : -1;
select((current + step + tabs.length) % tabs.length, true);
});

select(0, false);
}

const themeBtn = document.getElementById("themeBtn");
const root = document.documentElement;
const metaLight = document.querySelector('meta[name="theme-color"][media*="light"]');
const metaDark = document.querySelector('meta[name="theme-color"][media*="dark"]');
const mq = window.matchMedia("(prefers-color-scheme: dark)");
function isDark() {
const t = root.getAttribute("data-theme");
return t ? t === "dark" : mq.matches;
}
function syncMeta() {
const c = isDark() ? "#111318" : "#eef0f5";
if (metaLight) { metaLight.setAttribute("content", c); metaLight.removeAttribute("media"); }
if (metaDark) metaDark.remove();
}
try {
const saved = localStorage.getItem("theme");
if (saved === "dark" || saved === "light") root.setAttribute("data-theme", saved);
} catch (e) {}
syncMeta();
themeBtn.addEventListener("click", function () {
const next = isDark() ? "light" : "dark";
root.setAttribute("data-theme", next);
try { localStorage.setItem("theme", next); } catch (e) {}
syncMeta();
});
const btn = document.getElementById("shareBtn");
const toast = document.getElementById("toast");
let timer = 0;
function show(msg) {
toast.textContent = msg;
toast.classList.add("show");
clearTimeout(timer);
timer = setTimeout(function () {
toast.classList.remove("show");
}, 1800);
}
btn.addEventListener("click", async function () {
try {
if (navigator.share) {
await navigator.share({ title: document.title, url: location.href });
} else {
await navigator.clipboard.writeText(location.href);
show("링크가 복사되었습니다");
}
} catch (e) {
if (e && e.name !== "AbortError") show("복사에 실패했습니다");
}
});
}

renderTop();
renderReviews();
setupTabs();
setupDock();
setupDialog();
setupShare();
})();
</script>
