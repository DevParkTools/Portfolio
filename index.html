body {

img { display: block; max-width: 100%; }
button { font: inherit; color: inherit; }

blog: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>',
instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.8" fill="currentColor"/></svg>'
};
const dlg = document.getElementById("dlg");

function el(tag, cls, text) {
const n = document.createElement(tag);
if (cls) n.className = cls;
if (text !== undefined) n.textContent = text;
return n;
}

function img(src, cls, alt, w, h, fallback) {
const n = el("img", cls);
n.alt = alt || "";
n.loading = "lazy";
n.decoding = "async";
if (w) n.width = w;
if (h) n.height = h;
n.onerror = function () {
n.onerror = null;
n.src = fallback;
};
n.src = src;
return n;
}

function link(href, cls, text) {
const a = el("a", cls, text);
a.href = href;
a.target = "_blank";
a.rel = "noopener noreferrer";
return a;
}

function iconLink(href, cls, svg, label) {
const a = link(href, cls);
a.innerHTML = svg;
a.appendChild(el("span", null, label));
return a;
}

function renderTop() {
const avatar = document.getElementById("avatar");
avatar.onerror = function () {
avatar.onerror = null;
avatar.src = AVATAR_FALLBACK;
};
avatar.src = P.photo;
document.getElementById("name").textContent = P.name;
document.getElementById("intro").textContent = P.intro;

const bio = document.getElementById("bio");
const bf = document.createDocumentFragment();
for (let i = 0; i < D.about.length; i++) {
const li = el("li");
li.appendChild(el("span", null, D.about[i].icon));
li.appendChild(el("span", null, D.about[i].text));
bf.appendChild(li);
}
bio.appendChild(bf);

const stats = document.getElementById("stats");
const sf = document.createDocumentFragment();
for (let i = 0; i < D.stats.length; i++) {
const s = el("div", "stat");
s.appendChild(el("strong", null, D.stats[i].value));
s.appendChild(el("span", null, D.stats[i].label));
sf.appendChild(s);
}
stats.appendChild(sf);

const actions = document.getElementById("actions");
actions.appendChild(iconLink(P.kakao, "btn kakao", ICONS.kakao, "카카오톡 문의"));
actions.appendChild(iconLink(P.kmong, "btn kmong", ICONS.kmong, "크몽 프로필"));
actions.appendChild(iconLink(P.blog, "btn blog", ICONS.blog, "개발 블로그"));
actions.appendChild(iconLink(P.instagram, "btn insta", ICONS.instagram, "인스타그램"));
document.getElementById("footer").textContent = "© " + new Date().getFullYear() + " " + P.name;
}

function buildServices() {
const root = el("div", "list");
for (let i = 0; i < D.services.length; i++) {
const s = D.services[i];
const a = link(s.url, "item");
a.appendChild(img(s.image, "thumb", s.title, 184, 104, BOX_FALLBACK));
const info = el("div", "item-body");
info.appendChild(el("h3", null, s.title));
const meta = el("div", "meta");
meta.appendChild(el("b", null, s.price));
if (s.rating) meta.appendChild(el("span", null, s.rating));
info.appendChild(meta);
a.appendChild(info);
a.appendChild(el("span", "chev", "›"));
root.appendChild(a);
}
return root;
}

function openWork(w) {
dlg.textContent = "";
dlg.appendChild(w.image ? img(w.image, "dlg-cover", w.name, 652, 488, BOX_FALLBACK) : img(w.icon, "dlg-icon", w.name, 76, 76, BOX_FALLBACK));
dlg.appendChild(el("h3", null, w.name));
dlg.appendChild(el("span", "pill", w.genre));
if (w.desc) dlg.appendChild(el("p", null, w.desc));
const stores = el("div", "stores");
for (let i = 0; i < w.stores.length; i++) {
const st = w.stores[i];
const a = link(st.url, "btn", st.label + "에서 더보기");
a.style.background = STORE_COLORS[st.label] || "";
stores.appendChild(a);
}
const close = el("button", "btn ghost", "닫기");
close.type = "button";
close.addEventListener("click", function () {
dlg.close();
});
stores.appendChild(close);
dlg.appendChild(stores);
dlg.showModal();
}

function buildWorks() {
const wrap = el("div");
const grid = el("div", "games");
for (let i = 0; i < D.works.length; i++) {
const w = D.works[i];
const b = el("button", "game");
b.type = "button";
b.dataset.index = i;
b.setAttribute("aria-label", w.name + " 상세 보기");
b.appendChild(img(w.image || w.icon, null, w.name, 52, 52, BOX_FALLBACK));
b.appendChild(el("strong", null, w.name));
b.appendChild(el("span", "pill", w.genre));
grid.appendChild(b);
}
grid.addEventListener("click", function (e) {
const b = e.target.closest("button.game");
if (b) openWork(D.works[b.dataset.index]);
});
wrap.appendChild(grid);
const more = el("div", "more-row");
more.appendChild(link(P.playDeveloper, "more", "구글 플레이 전체 →"));
more.appendChild(link(P.kmongPortfolios, "more", "크몽 포트폴리오 전체 →"));
wrap.appendChild(more);
return wrap;
}

function setupTabs() {
const tabRoot = document.getElementById("tabs");
const panelRoot = document.getElementById("panels");
const builders = [buildServices, buildWorks];
const tabs = new Array(TAB_IDS.length);
const panels = new Array(TAB_IDS.length);
const tf = document.createDocumentFragment();
const pf = document.createDocumentFragment();
for (let i = 0; i < TAB_IDS.length; i++) {
const t = el("button", "tab", TAB_NAMES[i]);
t.type = "button";
t.id = "tab-" + TAB_IDS[i];
t.setAttribute("role", "tab");
t.setAttribute("aria-controls", "panel-" + TAB_IDS[i]);
t.setAttribute("aria-selected", "false");
t.tabIndex = -1;
const p = el("section", "panel");
p.id = "panel-" + TAB_IDS[i];
p.setAttribute("role", "tabpanel");
p.setAttribute("aria-labelledby", t.id);
p.hidden = true;
p.appendChild(builders[i]());
tabs[i] = t;
panels[i] = p;
tf.appendChild(t);
pf.appendChild(p);
}
tabRoot.appendChild(tf);
panelRoot.appendChild(pf);

let current = -1;
function select(i, focus) {
if (i === current) return;
if (current >= 0) {
tabs[current].setAttribute("aria-selected", "false");
tabs[current].tabIndex = -1;
panels[current].hidden = true;
}
tabs[i].setAttribute("aria-selected", "true");
tabs[i].tabIndex = 0;
panels[i].hidden = false;
current = i;
if (focus) tabs[i].focus();
try {
history.replaceState(null, "", "#" + TAB_IDS[i]);
} catch (e) {}
}

tabRoot.addEventListener("click", function (e) {
const i = tabs.indexOf(e.target);
if (i >= 0) select(i, false);
});
tabRoot.addEventListener("keydown", function (e) {
if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
const step = e.key === "ArrowRight" ? 1 : -1;
select((current + step + tabs.length) % tabs.length, true);
});

const start = TAB_IDS.indexOf(location.hash.slice(1));
select(start >= 0 ? start : 0, false);
}

function setupDialog() {
dlg.addEventListener("click", function (e) {
if (e.target === dlg) dlg.close();
});
}

function setupShare() {
const btn = document.getElementById("shareBtn");
const toast = document.getElementById("toast");
let timer = 0;
function show(msg) {
toast.textContent = msg;
toast.classList.add("show");
clearTimeout(timer);
timer = setTimeout(function () {
toast.classList.remove("show");
}, 1800);
}
btn.addEventListener("click", async function () {
try {
if (navigator.share) {
await navigator.share({ title: document.title, url: location.href });
} else {
await navigator.clipboard.writeText(location.href);
show("링크가 복사되었습니다");
}
} catch (e) {
if (e && e.name !== "AbortError") show("복사에 실패했습니다");
}
});
}

renderTop();
setupTabs();
setupDialog();
setupShare();
})();
</script>
