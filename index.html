function fmt(str, vars) {
return str.replace(/\{(\w+)\}/g, function (m, k) {
return vars[k] !== undefined ? vars[k] : m;
});
}

function won(str) {
if (LANG === "ko") return str;
return str.replace(/([\d,]+)원/g, "₩$1");
}

function pickList(tr, base, partial) {
if (partial) return tr || [];
return tr && tr.length === base.length ? tr : base;
}

function localize(lang) {
LANG = lang;
const pack = I18N[lang] || I18N.ko;
U = pack.ui;
if (lang === "ko") {
D = BASE;
P = BASE.profile;
return;
}
const profile = Object.assign({}, BASE.profile, { name: U.name, intro: U.intro });
const about = BASE.about.map(function (a, i) {
return Object.assign({}, a, { text: pack.about && pack.about[i] ? pack.about[i] : a.text });
});
const works = BASE.works.map(function (w, i) {
const parts = w.genre.split(" · ").map(function (g) {
return U.genres[g] || g;
});
const out = Object.assign({}, w, {
genre: parts.join(" · "),
desc: pack.descs && pack.descs[i] ? pack.descs[i] : w.desc
});
if (w.stores) {
out.stores = w.stores.map(function (st) {
return { key: st.label, label: U.stores[st.label] || st.label, url: st.url };
});
}
return out;
});
const services = BASE.services.map(function (s, i) {
const t = (pack.services && pack.services[i]) || {};
const optList = pickList(t.options, s.options, s.partial);
const options = s.options.map(function (o, k) {
const price = o.split(" · ").pop();
const label = optList[k];
if (label === o) return o;
return label + " · " + (price === "협의" ? U.negotiable : won(price));
});
const packages = s.packages.map(function (p, k) {
const d = t.packages && t.packages.length === s.packages.length ? t.packages[k] : p.desc;
return { name: p.name, price: won(p.price), desc: d };
});
const faq = s.partial ? (t.faq || []) : (t.faq && t.faq.length === s.faq.length ? t.faq : s.faq);
return Object.assign({}, s, {
title: t.title || s.title,
tagline: t.tagline || s.tagline,
badge: s.badge ? (t.badge || s.badge) : s.badge,
price: won(s.price),
sales: s.sales ? s.sales.replace(/(\d+)건 판매/, function (m, n) { return fmt(U.sold, { n: n }); }) : s.sales,
faq: faq,
outcomes: pickList(t.outcomes, s.outcomes, s.partial),
forWhom: pickList(t.forWhom, s.forWhom, s.partial),
notFor: pickList(t.notFor, s.notFor, s.partial),
process: pickList(t.process, s.process, s.partial),
packages: packages,
options: options,
inquiry: pickList(t.inquiry, s.inquiry, s.partial),
prep: pickList(t.prep, s.prep, s.partial),
notes: pickList(t.notes, s.notes, s.partial)
});
});
D = Object.assign({}, BASE, { profile: profile, about: about, works: works, services: services, responseNote: U.responseNote });
P = D.profile;
}

function el(tag, cls, text) {
const n = document.createElement(tag);
if (cls) n.className = cls;
if (text !== undefined) n.textContent = text;
return n;
}

function img(src, cls, alt, w, h, fallback) {
const n = el("img", cls);
n.alt = alt || "";
n.loading = "lazy";
n.decoding = "async";
if (w) n.width = w;
if (h) n.height = h;
n.onerror = function () {
n.onerror = null;
n.src = fallback;
};
n.src = src;
return n;
}

function ratingKey(s) {
const m = /([\d.]+)\s*\((\d+)\)/.exec(s.rating || "");
return m ? [parseFloat(m[1]), parseInt(m[2], 10)] : [0, 0];
}

function buildServices() {

order.sort(function (x, y) {
const rx = ratingKey(D.services[x]);
const ry = ratingKey(D.services[y]);
return ry[0] - rx[0] || ry[1] - rx[1] || x - y;
});

const CATS = ["전체", "바로 플레이", "구글 플레이", "액션", "RPG·전략", "퍼즐·캐주얼"];
const GENRE_RULES = [
["액션", /액션|AOS|서바이버|아케이드|플랫포머|대전|슈팅/],
["RPG·전략", /RPG|전략|모험|시뮬레이션|방치형|카드|보드게임/],
["퍼즐·캐주얼", /퍼즐|캐주얼|퀴즈|리듬/]
];

function workMatches(w, cat) {
if (cat === "전체") return true;
if (cat === "바로 플레이") return !!w.url;
if (cat === "구글 플레이") {
if (!w.stores) return false;
for (let i = 0; i < w.stores.length; i++) if (w.stores[i].label === "구글 플레이") return true;
return false;
}
for (let i = 0; i < GENRE_RULES.length; i++) {
if (GENRE_RULES[i][0] === cat) return GENRE_RULES[i][1].test(w.genre);
}
return false;
}

b.classList.add(k);
b.appendChild(el("span", "tag " + k, w.tag));

}

for (let i = 0; i < games.length; i++) {
if (BASE.works[i].kind === "util") continue;
const ok = workMatches(BASE.works[i], cat);
games[i].hidden = !ok;

const tf = document.createDocumentFragment();
const pf = document.createDocumentFragment();
for (let i = 0; i < TAB_IDS.length; i++) {
const t = el("button", "tab", U.tabs[i]);
t.type = "button";
t.id = "tab-" + TAB_IDS[i];
t.setAttribute("role", "tab");
t.setAttribute("aria-controls", "panel-" + TAB_IDS[i]);
t.setAttribute("aria-selected", "false");
t.tabIndex = -1;
const p = el("section", "panel");
p.id = "panel-" + TAB_IDS[i];
p.setAttribute("role", "tabpanel");
p.setAttribute("aria-labelledby", t.id);
p.hidden = true;
p.appendChild(builders[i]());
tabs[i] = t;
panels[i] = p;
tf.appendChild(t);
pf.appendChild(p);
}
tabRoot.appendChild(tf);
panelRoot.appendChild(pf);

let current = -1;
function select(i, focus) {
if (i === current) return;
if (current >= 0) {
tabs[current].setAttribute("aria-selected", "false");
tabs[current].tabIndex = -1;
panels[current].hidden = true;
}
tabs[i].setAttribute("aria-selected", "true");
tabs[i].tabIndex = 0;
panels[i].hidden = false;
current = i;
lastTab = i;
if (focus) tabs[i].focus();
}

tabRoot.addEventListener("click", function (e) {
const i = tabs.indexOf(e.target);
if (i >= 0) select(i, false);
});
tabRoot.addEventListener("keydown", function (e) {
if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
const step = e.key === "ArrowRight" ? 1 : -1;
select((current + step + tabs.length) % tabs.length, true);
});

select(lastTab, false);
}

function setupDialog() {
dlg.addEventListener("click", function (e) {
if (e.target === dlg) dlg.close();
});
sheet.addEventListener("click", function (e) {
if (e.target === sheet) sheet.close();
});
}

function setupShare() {
const themeBtn = document.getElementById("themeBtn");
const root = document.documentElement;
const metaLight = document.querySelector('meta[name="theme-color"][media*="light"]');
const metaDark = document.querySelector('meta[name="theme-color"][media*="dark"]');
const mq = window.matchMedia("(prefers-color-scheme: dark)");
function isDark() {
const t = root.getAttribute("data-theme");
return t ? t === "dark" : mq.matches;
}
function syncMeta() {
const c = isDark() ? "#111318" : "#eef0f5";
if (metaLight) { metaLight.setAttribute("content", c); metaLight.removeAttribute("media"); }
if (metaDark) metaDark.remove();
}
try {
const saved = localStorage.getItem("theme");
if (saved === "dark" || saved === "light") root.setAttribute("data-theme", saved);
} catch (e) {}
syncMeta();
themeBtn.addEventListener("click", function () {
const next = isDark() ? "light" : "dark";
root.setAttribute("data-theme", next);
try { localStorage.setItem("theme", next); } catch (e) {}
syncMeta();
});
const btn = document.getElementById("shareBtn");
const toast = document.getElementById("toast");
let timer = 0;
function show(msg) {
toast.textContent = msg;
toast.classList.add("show");
clearTimeout(timer);
timer = setTimeout(function () {
toast.classList.remove("show");
}, 1800);
}
btn.addEventListener("click", async function () {
try {
if (navigator.share) {
await navigator.share({ title: document.title, url: location.href });
} else {
await navigator.clipboard.writeText(location.href);
show(U.copied);
}
} catch (e) {
if (e && e.name !== "AbortError") show(U.copyFail);
}
});
}

function applyChrome() {
document.documentElement.lang = LANG;
document.title = U.title;
const md = document.querySelector('meta[name="description"]');
if (md) md.setAttribute("content", U.metaDesc);
const ogt = document.querySelector('meta[property="og:title"]');
if (ogt) ogt.setAttribute("content", U.title);
const ogd = document.querySelector('meta[property="og:description"]');
if (ogd) ogd.setAttribute("content", U.metaDesc);
document.getElementById("themeBtn").setAttribute("aria-label", U.themeAria);
document.getElementById("shareBtn").setAttribute("aria-label", U.shareAria);
const sel = document.getElementById("langSel");
sel.setAttribute("aria-label", U.langAria);
sel.value = LANG;
}

function renderAll() {
if (dlg.open) dlg.close();
if (sheet.open) sheet.close();
applyChrome();
renderTop();
renderReviews();
setupTabs();
setupDock();
}

function detectLang() {
try {
const q = new URLSearchParams(location.search).get("lang");
if (LANGS.indexOf(q) >= 0) return q;
} catch (e) {}
try {
const saved = localStorage.getItem("lang");
if (LANGS.indexOf(saved) >= 0) return saved;
} catch (e) {}
const nav = (navigator.language || "ko").slice(0, 2).toLowerCase();
return LANGS.indexOf(nav) >= 0 ? nav : "en";
}

document.getElementById("langSel").addEventListener("change", function (e) {
const next = e.target.value;
try { localStorage.setItem("lang", next); } catch (err) {}
localize(next);
renderAll();
});

localize(detectLang());
renderAll();
setupDialog();
setupShare();
})();
</script>
</body>
</html>
